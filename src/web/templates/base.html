<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Ukulele Tabs Maker{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --surface: #fffdf8;
      --border: #ded3c0;
      --ink: #211d17;
      --muted: #6b6053;
      --accent: #2a6f6b;
      --accent-ink: #ffffff;
      --ok: #2f6f45;
      --ok-bg: #e8f3ec;
      --warn: #8a5a12;
      --warn-bg: #faf0dc;
      --bad: #8f2f2f;
      --bad-bg: #f9e8e6;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140f;
        --surface: #201d17;
        --border: #3a352b;
        --ink: #f0ebe1;
        --muted: #a89c8a;
        --accent: #4fb3ad;
        --accent-ink: #10201f;
        --ok: #8fd3a8;
        --ok-bg: #1c2a21;
        --warn: #e2b465;
        --warn-bg: #2c2418;
        --bad: #eb9a94;
        --bad-bg: #2e1d1c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 72px; }
    header { margin-bottom: 28px; }
    h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }
    a { color: var(--accent); }
    button, .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    .btn.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
    }
    .banner {
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 18px;
      border: 1px solid transparent;
    }
    .banner strong { display: block; }
    .banner.ok   { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok); }
    .banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
    .banner.bad  { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad); }
    .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 0.9rem; }
    .facts b { color: var(--ink); font-weight: 600; }
    .sheet {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .system {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      white-space: pre;
      margin: 0 0 18px;
    }
    .system:last-child { margin-bottom: 0; }
    .system .label { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .progress { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
    .muted { color: var(--muted); }
    table.notes { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.notes td { padding: 3px 10px 3px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="/" style="color:inherit;text-decoration:none">Ukulele Tabs Maker</a></h1>
      <p class="sub">{% block subtitle %}Turn a tab tutorial into a tab sheet you can download.{% endblock %}</p>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
